name: Build unsigned IPA

on:
  push:
    branches: ['**']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  ipa:
    name: xcodebuild archive -> ipa
    runs-on: macos-15
    timeout-minutes: 40

    steps:
      - name: Checkout patch repo
        uses: actions/checkout@v4

      - name: Fetch upstream Iridium source
        run: |
          git clone --depth 1 https://github.com/pxx917144686/Iridium_iOS.git src
          git -C src log --oneline -1

      - name: Apply patches
        run: |
          set -euo pipefail
          APP=src/Application/iridium
          test -d "$APP/Interface/AppListViewController" || { echo "::error::上游目录结构变了"; exit 1; }
          cp patch/AppStoreLink.swift                        "$APP/Interface/AppListViewController/"
          cp patch/AppListViewController.swift               "$APP/Interface/AppListViewController/"
          cp 'patch/AppListViewController+TableView.swift'   "$APP/Interface/AppListViewController/"
          cp patch/AppDelegate.swift                         "$APP/App/"
          cp patch/Extension.swift                           "$APP/App/"
          cp patch/AgentWrapper.swift                        "$APP/Backend/"
          cp patch/SettingView.swift                         "$APP/Interface/SettingViewController/"
          cp patch/DecrypterViewController.swift             "$APP/Interface/Decrypter/"
          cp patch/Main.storyboard                           "$APP/Base.lproj/"
          cp patch/RootMe.m                                  src/AuxiliaryAgent/AuxiliaryAgent/
          cp patch/prepare.ipa.sh                            src/Workflow/prepare.ipa.sh
          cp patch/iridium.project.pbxproj                   src/Application/iridium.xcodeproj/project.pbxproj
          echo "--- 关键改动落地检查 ---"
          grep -n 'installAppStoreLinkEntry' "$APP/Interface/AppListViewController/AppListViewController.swift"
          grep -n 'parent_is_trusted' src/AuxiliaryAgent/AuxiliaryAgent/RootMe.m | head -3
          echo "--- 中文化命中数 ---"
          grep -c '应用列表' "$APP/Interface/AppListViewController/AppListViewController.swift" || true
          grep -c '辅助程序启动失败' "$APP/App/AppDelegate.swift" || true
          grep -c '砸壳日志' "$APP/Interface/Decrypter/DecrypterViewController.swift" || true

      - name: Install ldid
        run: |
          brew install ldid || brew upgrade ldid || true
          which ldid && ldid -v 2>&1 | head -3 || true

      - name: Build unsigned IPA
        run: |
          chmod +x src/Workflow/prepare.ipa.sh src/Workflow/prepare.app.sh src/AuxiliaryAgent/build.sh
          bash src/Workflow/prepare.ipa.sh

      - name: Verify ipa content
        if: always()
        run: |
          set -uo pipefail
          IPA=$(cat src/build/ipa/ipa-path.txt 2>/dev/null || true)
          if [ -z "$IPA" ] || [ ! -f "$IPA" ]; then
            echo "::warning::没产出 ipa，贴构建日志尾部"
            tail -80 src/build/ipa/xcodebuild.log 2>/dev/null || true
            exit 1
          fi
          unzip -l "$IPA" | head -20
          for p in iridium AuxiliaryAgent fouldecrypt.tfp0 fouldecrypt.krw fouldecrypt.kernrw Info.plist; do
            if unzip -l "$IPA" | grep -q "Payload/iridium.app/$p"; then echo "  OK   $p"; else echo "::warning::缺 $p"; fi
          done
          mkdir -p /tmp/x && rm -rf /tmp/x/* && unzip -oq "$IPA" -d /tmp/x
          echo "--- 主二进制 entitlements ---"
          ldid -e /tmp/x/Payload/iridium.app/iridium || true
          echo "--- AuxiliaryAgent entitlements（必须是 platform-application，否则 whoami 拿不到 root）---"
          ldid -e /tmp/x/Payload/iridium.app/AuxiliaryAgent || true
          echo "--- 中文文案抽查 ---"
          strings /tmp/x/Payload/iridium.app/iridium | grep -m5 -E '应用列表|砸壳日志|辅助程序启动失败|读不到应用列表' || echo "::warning::没搜到中文文案"
          echo "### $(basename "$IPA") · $(du -h "$IPA" | cut -f1)" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: iridium-unsigned-ipa
          path: src/build/ipa/*.ipa
          if-no-files-found: error
          retention-days: 30

      - name: Publish to release (镜像可直连下载)
        if: success()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          gh release delete ipa-latest --yes --cleanup-tag 2>/dev/null || true
          IPA=$(ls src/build/ipa/*.ipa | head -1)
          cp "$IPA" /tmp/iridium.unsigned.ipa
          gh release create ipa-latest /tmp/iridium.unsigned.ipa \
            --title "Iridium unsigned ipa ($(date -u +%Y-%m-%d))" \
            --notes "App Store 链接直砸 + 中文界面 + ipa 安装路径权限修复。未签名，用 TrollStore / 全能签 / Sideloadly 安装。"
          gh release view ipa-latest --json assets --jq '.assets[] | "\(.name)  \(.size) B  \(.url)"'
