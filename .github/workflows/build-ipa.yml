name: Build unsigned IPA

on:
  push:
    branches: ['**']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  ipa:
    name: xcodebuild archive -> ipa
    runs-on: macos-15
    timeout-minutes: 40

    steps:
      - name: Checkout patch repo
        uses: actions/checkout@v4

      - name: Fetch upstream Iridium source
        run: |
          git clone --depth 1 https://github.com/pxx917144686/Iridium_iOS.git src
          ls src
          git -C src log --oneline -1

      - name: Apply App Store link patch
        run: |
          set -euo pipefail
          APPDIR=src/Application/iridium/Interface/AppListViewController
          test -d "$APPDIR" || { echo "::error::上游目录结构变了"; exit 1; }
          cp patch/AppStoreLink.swift "$APPDIR/"
          cp patch/AppListViewController.swift "$APPDIR/"
          cp patch/prepare.ipa.sh src/Workflow/prepare.ipa.sh
          cp patch/iridium.project.pbxproj src/Application/iridium.xcodeproj/project.pbxproj
          echo "--- pbxproj 注册点 ---"
          grep -n 'AppStoreLink' src/Application/iridium.xcodeproj/project.pbxproj
          echo "--- 入口调用点 ---"
          grep -n 'installAppStoreLinkEntry' "$APPDIR/AppListViewController.swift"

      - name: Install ldid
        run: |
          brew install ldid || brew upgrade ldid || true
          which ldid && ldid -v 2>&1 | head -3 || true

      - name: Build unsigned IPA
        run: |
          chmod +x src/Workflow/prepare.ipa.sh src/Workflow/prepare.app.sh src/AuxiliaryAgent/build.sh
          bash src/Workflow/prepare.ipa.sh

      - name: Verify ipa content
        if: always()
        run: |
          set -uo pipefail
          IPA=$(cat src/build/ipa/ipa-path.txt 2>/dev/null || true)
          if [ -z "$IPA" ] || [ ! -f "$IPA" ]; then
            echo "::warning::没产出 ipa，贴构建日志尾部"
            tail -80 src/build/ipa/xcodebuild.log 2>/dev/null || true
            exit 1
          fi
          unzip -l "$IPA" | head -20
          for p in iridium AuxiliaryAgent fouldecrypt.tfp0 fouldecrypt.krw fouldecrypt.kernrw Info.plist; do
            if unzip -l "$IPA" | grep -q "Payload/iridium.app/$p"; then echo "  OK   $p"; else echo "::warning::缺 $p"; fi
          done
          unzip -p "$IPA" "Payload/iridium.app/iridium" > /tmp/iridium.bin
          ldid -e /tmp/iridium.bin || true
          echo "### $(basename "$IPA") · $(du -h "$IPA" | cut -f1)" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: iridium-unsigned-ipa
          path: src/build/ipa/*.ipa
          if-no-files-found: error
          retention-days: 30

      - name: Publish to release (镜像可直连下载)
        if: success()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          gh release delete ipa-latest --yes --cleanup-tag 2>/dev/null || true
          IPA=$(ls src/build/ipa/*.ipa | head -1)
          cp "$IPA" /tmp/iridium.unsigned.ipa
          gh release create ipa-latest /tmp/iridium.unsigned.ipa \
            --title "Iridium unsigned ipa ($(date -u +%Y-%m-%d))" \
            --notes "App Store 链接直砸改造版，未签名。装法：TrollStore / 全能签 / Sideloadly 重签。"
          gh release view ipa-latest --json assets --jq '.assets[] | "\(.name)  \(.size) B  \(.url)"'
