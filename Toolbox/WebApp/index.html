<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="离线工具箱">
<meta name="theme-color" content="#0b1120">
<title>房贷计算 · 离线工具箱</title>
<link rel="stylesheet" href="css/app.css">
</head>
<body>

<header class="hd">
  <h1>房贷计算</h1>
  <p>等额本息 / 等额本金 · 支持提前还款试算</p>
</header>

<main id="app">

  <section class="card">
    <h2>贷款信息</h2>

    <div class="field">
      <label>贷款金额</label>
      <div class="row">
        <input type="number" inputmode="decimal" data-k="amount" value="100" min="0" step="1" placeholder="100">
        <span class="unit-tag">万元</span>
      </div>
    </div>

    <div class="field">
      <label>年利率</label>
      <div class="row">
        <input type="number" inputmode="decimal" data-k="rate" value="3.1" min="0" step="0.05" placeholder="3.1">
        <span class="unit-tag">%</span>
      </div>
    </div>

    <div class="field">
      <label>贷款年限</label>
      <div class="row">
        <input type="number" inputmode="numeric" data-k="years" value="30" min="1" max="40" step="1" placeholder="30">
        <span class="unit-tag">年</span>
      </div>
    </div>

    <div class="field">
      <label>还款方式</label>
      <div class="seg" data-seg="mode">
        <button type="button" data-v="equal" aria-pressed="true">等额本息</button>
        <button type="button" data-v="principal" aria-pressed="false">等额本金</button>
      </div>
    </div>
  </section>

  <section class="card">
    <h2>测算结果</h2>
    <div class="big"><b class="num" id="o-monthly">—</b><span id="o-monthly-tag">元 / 月</span></div>
    <dl class="rows" id="o-rows"></dl>
  </section>

  <section class="card">
    <h2>还款明细（前 6 期）</h2>
    <div class="scrollx">
      <table>
        <thead><tr><th>期</th><th>月供</th><th>本金</th><th>利息</th><th>剩余本金</th></tr></thead>
        <tbody id="o-schedule"></tbody>
      </table>
    </div>
    <p class="note" id="o-schedule-note"></p>
  </section>

  <section class="card">
    <h2>提前还款试算</h2>

    <div class="row" style="margin-bottom:12px">
      <div class="field">
        <label>已还期数</label>
        <input type="number" inputmode="numeric" data-k="paid" value="12" min="0" step="1">
      </div>
      <div class="field">
        <label>提前还款</label>
        <div class="row">
          <input type="number" inputmode="decimal" data-k="prepay" value="10" min="0" step="1">
          <span class="unit-tag">万元</span>
        </div>
      </div>
    </div>

    <div class="field">
      <label>提前还款后</label>
      <div class="seg" data-seg="plan">
        <button type="button" data-v="shorten" aria-pressed="true">缩短年限</button>
        <button type="button" data-v="reduce" aria-pressed="false">减少月供</button>
      </div>
      <p class="hint" id="o-plan-hint"></p>
    </div>

    <dl class="rows" id="o-prepay"></dl>
    <p class="note">口径：先按原计划算出「剩余本金」与「剩余利息」，再按新方案重算。银行实际以放款日、还款日、利率调整与违约金条款为准，这里只做决策参考。</p>
  </section>

</main>
