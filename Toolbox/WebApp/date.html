<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="离线工具箱">
<meta name="theme-color" content="#0b1120">
<title>日期天数 · 离线工具箱</title>
<link rel="stylesheet" href="css/app.css">
</head>
<body>

<header class="hd">
  <h1>日期天数</h1>
  <p>相差天数 · 日期推算 · 倒计时</p>
</header>

<main id="app">

  <section class="card">
    <h2>两个日期相差</h2>
    <div class="row">
      <div class="field"><label>起始</label><input type="date" data-k="d1"></div>
      <div class="field"><label>结束</label><input type="date" data-k="d2"></div>
    </div>
    <dl class="rows" id="o-diff"></dl>
  </section>

  <section class="card">
    <h2>日期推算</h2>
    <div class="row" style="margin-bottom:12px">
      <div class="field"><label>基准日期</label><input type="date" data-k="d3"></div>
      <div class="field"><label>加减（负数往前）</label><input type="number" inputmode="numeric" data-k="n" value="100" step="1"></div>
    </div>
    <div class="field">
      <label>单位</label>
      <div class="seg" data-seg="unit">
        <button type="button" data-v="day" aria-pressed="true">天</button>
        <button type="button" data-v="week" aria-pressed="false">周</button>
        <button type="button" data-v="month" aria-pressed="false">月</button>
        <button type="button" data-v="year" aria-pressed="false">年</button>
      </div>
    </div>
    <div class="big" style="margin-top:12px"><b class="num" id="o-date">—</b></div>
    <p class="note" id="o-date-note"></p>
  </section>

  <section class="card">
    <h2>倒计时</h2>
    <div class="field"><label>目标日期</label><input type="date" data-k="d4"></div>
    <dl class="rows" id="o-count"></dl>
  </section>

  <section class="card">
    <h2>今天</h2>
    <dl class="rows" id="o-today"></dl>
  </section>

</main>

</nav>
