<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="离线工具箱">
<meta name="theme-color" content="#0b1120">
<title>单位换算 · 离线工具箱</title>
<link rel="stylesheet" href="css/app.css">
</head>
<body>

<header class="hd">
  <h1>单位换算</h1>
  <p>长度 · 面积 · 重量 · 温度 · 数据 · 时间 · 速度</p>
</header>

<main id="app">

  <section class="card">
    <h2>输入</h2>
    <div class="field">
      <label>类别</label>
      <select data-k="cat" id="cat"></select>
    </div>
    <div class="row">
      <div class="field">
        <label>数值</label>
        <input type="number" inputmode="decimal" data-k="val" value="1" step="any">
      </div>
      <div class="field">
        <label>单位</label>
        <select data-k="from" id="from"></select>
      </div>
    </div>
  </section>

  <section class="card">
    <h2>换算结果</h2>
    <dl class="rows" id="o-all"></dl>
    <p class="note">点任意结果即可复制。全部为本地换算，不联网。</p>
    <div id="o-toast" style="font-size:13px;color:var(--ok);height:18px"></div>
  </section>

</main>

<nav class="tabbar">
  <a href="index.html">
    <svg viewBox="0 0 24 24"><path d="M3 10.5 12 3l9 7.5"/><path d="M5.5 9.5V21h13V9.5"/><path d="M10 21v-6h4v6"/></svg>
    <span>房贷</span>
  </a>
  <a href="salary.html">

    <span>工资</span>
  </a>
  <a href="date.html">
    <svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="16" rx="2.5"/><path d="M3 10h18M8 3v4M16 3v4"/></svg>
    <span>日期</span>
  </a>
  <a href="unit.html" aria-current="page">
    <svg viewBox="0 0 24 24"><path d="M3.5 8.5h14l-3.2-3.2M20.5 15.5h-14l3.2 3.2"/></svg>
    <span>换算</span>
  </a>
</nav>

<script src="js/app.js"></script>
<script src="js/unit.js"></script>
</body>
</html>
